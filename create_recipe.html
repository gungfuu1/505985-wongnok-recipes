<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างเมนูอาหาร</title>
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="gf-bar gf-light-grey gf-card-4">
    <a href="index.html" class="gf-bar-item gf-button">หน้าหลัก</a>
    <a href="profile.html" class="gf-bar-item gf-button">โปรไฟล์</a>
    <a href="login.html" class="gf-bar-item gf-button gf-right" id="loginMenu">เข้าสู่ระบบ</a>
    <a href="register.html" class="gf-bar-item gf-button gf-right">ลงทะเบียน</a>
    <a href="create_recipe.html" class="gf-bar-item gf-button gf-right" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
  </div>

  <div class="gf-container gf-padding">
    <h2>สร้างเมนูอาหาร</h2>
    <form id="createForm">
      <input type="text" id="title" placeholder="ชื่อเมนู" class="gf-input gf-border" required><br><br>
      <textarea id="detail" placeholder="รายละเอียด" class="gf-input gf-border"></textarea><br><br>
      <textarea id="ingredients" placeholder="วัตถุดิบ" class="gf-input gf-border"></textarea><br><br>
      <textarea id="steps" placeholder="ขั้นตอนการทำ" class="gf-input gf-border"></textarea><br><br>
      <input type="number" id="cookingTime" placeholder="เวลาปรุง (นาที)" class="gf-input gf-border"><br><br>
      <select id="difficulty" class="gf-input gf-border">
        <option value="ง่าย">ง่าย</option>
        <option value="ปานกลาง">ปานกลาง</option>
        <option value="ยาก">ยาก</option>
      </select><br><br>
      <input type="url" id="imageUrl" placeholder="ลิงก์รูปอาหาร" class="gf-input gf-border"><br><br>
      <button type="submit" class="gf-button gf-green">บันทึก</button>
    </form>
  </div>
</body>
</html>
