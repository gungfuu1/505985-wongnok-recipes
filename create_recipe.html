<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างสูตรอาหาร - Wongnok Recipes</title>
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script-non-module.js"></script>
</head>
<body>
    <div class="gf-menubar gf-light-grey gf-padding">
    <a href="index.html" class="gf-title" style="text-decoration:none; color:inherit;">Wongnok Recipes</a>
    <div class="gf-right">
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button" id="registerMenu">ลงทะเบียน</a>
      <a href="profile.html" class="gf-button" id="profileMenu" style="display:none;">โปรไฟล์</a>
      <a href="about.html" class="gf-button">About</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
    </div>
  </div>

  <div class="gf-container gf-padding" style="max-width:600px; margin:auto">
    <h2>สร้างสูตรอาหารใหม่</h2>
    <form id="createRecipeForm">
      <input type="text" id="title" placeholder="ชื่อเมนูอาหาร" class="gf-input gf-border" required><br><br>
      <textarea id="detail" placeholder="รายละเอียด" class="gf-input gf-border"></textarea><br><br>
      <textarea id="ingredients" placeholder="วัตถุดิบ" class="gf-input gf-border" required></textarea><br><br>
      <textarea id="steps" placeholder="ขั้นตอนการทำ" class="gf-input gf-border" required></textarea><br><br>
      <input type="number" id="cookingTime" placeholder="เวลาปรุง (นาที)" class="gf-input gf-border"><br><br>
      <select id="difficulty" class="gf-input gf-border">
        <option value="ง่าย">ง่าย</option>
        <option value="ปานกลาง">ปานกลาง</option>
        <option value="ยาก">ยาก</option>
        <option value="ยาก">ยากเรือหาย</option>
      </select><br><br>
      <input type="url" id="imageUrl" placeholder="URL รูปภาพ" class="gf-input gf-border"><br><br>
      <button type="submit" class="gf-button gf-green">บันทึก</button>
    </form>
  </div>



  <script>
  document.addEventListener('DOMContentLoaded', () => {
    checkLoginStatus();

    const form = document.getElementById('createRecipeForm');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
          alert('กรุณาเข้าสู่ระบบก่อนสร้างเมนู');
          window.location.href = 'login.html';
          return;
        }

        const data = {
          title: document.getElementById('title').value,
          detail: document.getElementById('detail').value,
          ingredients: document.getElementById('ingredients').value,
          steps: document.getElementById('steps').value,
          cooking_time: parseInt(document.getElementById('cookingTime').value),
          difficulty: document.getElementById('difficulty').value,
          image_url: document.getElementById('imageUrl').value,
          user_id: user.id,
          created_at: new Date().toISOString()
        };

        try {
          await axios.post(`${supabaseUrl}/rest/v1/recipes`, data, {
            headers: {
              apikey: apiKey,
              Authorization: `Bearer ${apiKey}`,
              'Content-Type': 'application/json',
              Prefer: 'return=representation'
            }
          });
          alert('เพิ่มเมนูอาหารสำเร็จ');
          window.location.href = 'profile.html';
        } catch (err) {
          console.error('createRecipe error', err);
          alert('ไม่สามารถบันทึกเมนูได้ กรุณาลองใหม่');
        }
      });
    }
  });
</script>

</body>
</html>
