<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'unsafe-eval'; 
        connect-src 'self' https://asooyypcnuxtaxzosvaa.supabase.co;
    ">
    <title>สร้างสูตรอาหาร</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="gf-bar gf-light-grey gf-card-4">
            <a href="index.html" class="gf-bar-item gf-button">หน้าหลัก</a>
            <a href="about.html" class="gf-bar-item gf-button">About</a>
            <a href="login.html" class="gf-bar-item gf-button gf-right" id="loginMenu">เข้าสู่ระบบ</a>
            <a href="register.html" class="gf-bar-item gf-button gf-right">ลงทะเบียน</a>
            <a href="create_recipe.html" class="gf-bar-item gf-button gf-right" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
        </div>


    <div class="gf-content gf-padding-large" style="max-width:600px; margin:auto; margin-top:50px;">
        <h2>สร้างสูตรอาหาร</h2>

        <form id="createRecipeForm">
            <label>ชื่อเมนูอาหาร</label>
            <input type="text" id="menuName" class="gf-input gf-border" required>

            <label>รายละเอียด</label>
            <textarea id="description" class="gf-input gf-border" rows="3" required></textarea>

            <label>วัตถุดิบ</label>
            <textarea id="ingredients" class="gf-input gf-border" rows="4" required></textarea>

            <label>ขั้นตอนการทำ</label>
            <textarea id="steps" class="gf-input gf-border" rows="4" required></textarea>

            <label>ระยะเวลาการปรุง (นาที)</label>
            <input type="number" id="cookingTime" class="gf-input gf-border" required>

            <label>รูปภาพประกอบ (URL)</label>
            <input type="url" id="imageUrl" class="gf-input gf-border" required>

            <button type="submit" class="gf-button gf-green gf-margin-top">บันทึกสูตรอาหาร</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        // ตรวจสอบว่า login ไว้หรือยัง (ตัวอย่างใช้ localStorage)
        if (!localStorage.getItem('user_id')) {
            alert('กรุณาเข้าสู่ระบบก่อนใช้งาน');
            window.location.href = 'login.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_name');
            window.location.href = 'login.html';
        });

        document.getElementById('createRecipeForm').addEventListener('submit', async function(e){
            e.preventDefault();

            const menuName = document.getElementById('menuName').value;
            const description = document.getElementById('description').value;
            const ingredients = document.getElementById('ingredients').value;
            const steps = document.getElementById('steps').value;
            const cookingTime = parseInt(document.getElementById('cookingTime').value);
            const imageUrl = document.getElementById('imageUrl').value;
            const userId = localStorage.getItem('user_id');

            const result = await createRecipe(menuName, description, ingredients, steps, cookingTime, imageUrl, userId);

            if (result) {
                alert('เพิ่มเมนูสำเร็จ');
                window.location.href = 'index.html';
            } else {
                alert('เกิดข้อผิดพลาด');
            }
        });
    </script>

</body>
</html>
