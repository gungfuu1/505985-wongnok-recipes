<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สร้างสูตรอาหาร - Wongnok Recipes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script-non-module.js"></script>
</head>

<body>
    <div class="gf-menubar gf-light-grey gf-padding">
    <button class="gf-menu-toggle" onclick="toggleMenu()">☰</button>
    <a href="index.html" class="gf-title">Wongnok Recipes</a>
    <div class="gf-right" id="mobileMenu">
      <span id="userGreeting" style="margin-right: 15px; font-weight: bold; display:none;"></span>
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button" id="registerMenu">ลงทะเบียน</a>
      <a href="profile.html" class="gf-button" id="profileMenu" style="display:none;">โปรไฟล์</a>
      <a href="about.html" class="gf-button">About</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
    </div>
  </div>

  <div class="gf-container gf-padding" style="max-width:600px; margin:auto">
    <h2>สร้างสูตรอาหารใหม่</h2>
    <form id="createRecipeForm">
      <input type="text" id="title" placeholder="ชื่อเมนูอาหาร" class="gf-input gf-border" required><br><br>
      <textarea id="detail" placeholder="รายละเอียด" class="gf-input gf-border"></textarea><br><br>
      <textarea id="ingredients" placeholder="วัตถุดิบที่ใช้" class="gf-input gf-border" required></textarea><br><br>
      <textarea id="steps" placeholder="ขั้นตอนการทำ" class="gf-input gf-border" required></textarea><br><br>
      <input type="number" id="cookingTime" placeholder="เวลาปรุง (นาที)" class="gf-input gf-border"><br><br>
      <select id="difficulty" class="gf-input gf-border">
        <option value="ง่าย">ง่าย</option>
        <option value="ปานกลาง">ปานกลาง</option>
        <option value="ยาก">ยาก</option>
        <option value="ยาก">ยากเรือหาย</option>
      </select><br><br>
      <input type="url" id="imageUrl" placeholder="URL รูปภาพ จากเว็บต่างๆ คลิกขวา coppy image address แล้วมาวางตรงนี้ได้เลย " class="gf-input gf-border"><br><br>
      <button type="submit" class="gf-button gf-green">บันทึก</button>
    </form>
  </div>
<br><br>


  


<footer style="background-color:#333; color:white; text-align:center; padding:20px; margin-top:40px;">
  <p>เว็บไซต์แชร์สูตรเมนูอาหารสำหรับทุกคน Login เพื่อสร้างเมนูอาหารของคุณ และโหวตเมนูอาหารของเพื่อน</p>
  <p>ติดต่อ: 505985@wongnok.app</p>
  <p>พัฒนาโดย: GungFuu 1.</p>
</footer>
</body>
</html>
