<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนสมาชิก - GF Food Blog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script-non-module.js"></script>

    import { registerUser, checkLoginStatus } from './script.js';
    window.registerUser = registerUser;
    document.addEventListener('DOMContentLoaded', checkLoginStatus);
  </script>
</head>
<body>
  <div class="gf-menubar gf-light-grey gf-padding">
    <span class="gf-title">GF Food Blog</span>
    <div class="gf-right">
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button">ลงทะเบียน</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
      <a href="create_recipe.html" class="gf-button" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
      <a href="about.html" class="gf-button">About</a>
    </div>
  </div>

  <div class="gf-container gf-padding" style="max-width:600px;margin:auto">
    <h2>สมัครสมาชิก</h2>
    <input id="reg-fullname" class="gf-input gf-border" type="text" placeholder="ชื่อ-สกุล"><br><br>
    <input id="reg-age" class="gf-input gf-border" type="number" placeholder="อายุ"><br><br>
    <input id="reg-occupation" class="gf-input gf-border" type="text" placeholder="อาชีพ"><br><br>
    <input id="reg-email" class="gf-input gf-border" type="email" placeholder="อีเมล"><br><br>
    <input id="reg-birthdate" class="gf-input gf-border" type="date"><br><br>
    <input id="reg-password" class="gf-input gf-border" type="password" placeholder="รหัสผ่าน"><br><br>
    <button onclick="registerUser()" class="gf-button gf-orange">ลงทะเบียน</button>
  </div>
</body>
</html>
