<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GF Food Blog - เมนูอาหาร</title>
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script-non-module.js"></script>
</head>
<body>
  <div class="gf-menubar gf-light-grey gf-padding">
    <span class="gf-title">GF Food Blog</span>
    <div class="gf-right">
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button">ลงทะเบียน</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
      <a href="create_recipe.html" class="gf-button" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
      <a href="about.html" class="gf-button">About</a>
    </div>
  </div>

  <div class="gf-container gf-padding">
    <div class="gf-row">
      <input id="searchBox" class="gf-input gf-border" type="text" placeholder="ค้นหาชื่อเมนูหรือวัตถุดิบ..." oninput="loadAllRecipes()">
<select id="filterSelect" class="gf-select gf-border gf-margin-left" onchange="loadAllRecipes()">
        <option value="">เรียงตาม...</option>
        <option value="rating">Rating สูงสุด</option>
        <option value="cooking_time">เวลาปรุง (น้อยสุดก่อน)</option>
      </select>
    </div>

    <div id="recipesList" class="gf-row-padding gf-margin-top gf-container"></div>
  </div>
</body>
</html>
