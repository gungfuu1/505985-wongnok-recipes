<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wongnok Recipes - เมนูอาหาร</title>
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script-non-module.js"></script>
</head>
<body>
  <div class="gf-menubar gf-light-grey gf-padding">
    <a href="index.html" class="gf-title" style="text-decoration:none; color:inherit;">Wongnok Recipes</a>
    <div class="gf-right">
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button" id="registerMenu">ลงทะเบียน</a>
      <a href="profile.html" class="gf-button" id="profileMenu" style="display:none;">โปรไฟล์</a>
      <a href="create_recipe.html" class="gf-button" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
      <a href="about.html" class="gf-button">About</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
    </div>
  </div>

  <div class="gf-container gf-padding">
    <div class="gf-row gf-gap">
      <input id="searchBox" class="gf-input gf-border gf-col" type="text" placeholder="ค้นหาชื่อเมนูหรือวัตถุดิบ..." style="flex:1;" oninput="loadAllRecipes()">
<select id="filterSelect" class="gf-select gf-border gf-col" style="flex:1;" onchange="loadAllRecipes()">
        <option value="">เรียงตาม ผู้สร้าง</option>
        <option value="rating">Rating สูงสุด</option>
        <option value="cooking_time">เวลาปรุง (น้อยสุดก่อน)</option>
      </select>
    </div>

    <div id="recipesList" class="gf-row gf-padding"></div>
  </div>

<footer style="background-color:#333; color:white; text-align:center; padding:20px; margin-top:40px;">
  <p>ติดต่อ: 505985@wongnok.app</p>
  <p>พัฒนาโดย: GungFuu 1.</p>
</footer>

</body>
</html>
