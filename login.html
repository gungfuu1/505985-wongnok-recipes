<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'unsafe-eval'; 
        connect-src 'self' https://asooyypcnuxtaxzosvaa.supabase.co;
    ">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module"></script>
</head>
<body>
    <div class="gf-bar gf-light-grey gf-card-4">
        <a href="index.html" class="gf-bar-item gf-button">หน้าหลัก</a>
        <a href="about.html" class="gf-bar-item gf-button">About</a>
        <a href="login.html" class="gf-bar-item gf-button gf-right" id="loginMenu">เข้าสู่ระบบ</a>
        <a href="register.html" class="gf-bar-item gf-button gf-right">ลงทะเบียน</a>
        <a href="create_recipe.html" class="gf-bar-item gf-button gf-right" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
    </div>

    <div class="gf-container gf-padding">
        <h2>เข้าสู่ระบบ</h2>
        <!--  ID ตรงกับที่ใช้ใน script.js -->
        <input type="email" id="gf-login-email" placeholder="Email" class="gf-input gf-border"><br><br>
        <input type="password" id="gf-login-password" placeholder="รหัสผ่าน" class="gf-input gf-border"><br><br>
        <button id="loginBtn" class="gf-button gf-blue">เข้าสู่ระบบ</button>
        <p>ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน</a></p>
    </div>

    <script type="module">
        import { checkLoginStatus, gfLogin } from './script.js';
        checkLoginStatus();

        document.getElementById('loginBtn').addEventListener('click', gfLogin);
    </script>
</body>
</html>
