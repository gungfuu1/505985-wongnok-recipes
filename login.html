<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <title>เข้าสู่ระบบ - GF Food Blog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script-non-module.js"></script>

    import { loginUser, checkLoginStatus } from './script.js';
    window.loginUser = loginUser;

</head>
<body>
  <div class="gf-menubar gf-light-grey gf-padding">
