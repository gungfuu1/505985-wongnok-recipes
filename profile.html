<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>โปรไฟล์ของฉัน</title>
  <link rel="stylesheet" href="style.css">
  <script src="axios.min.js"></script>
  <script src="script-non-module.js"></script>
  <style>
    /* จัดให้ข้อมูลผู้ใช้เด่นชัด */
    #userInfo {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9f9f9;
      max-width: 600px;
    }
    #userInfo h2 {
      margin: 0 0 10px 0;
    }
    #userInfo p {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="gf-menubar gf-light-grey gf-padding">
    <a href="index.html" class="gf-title" style="text-decoration:none; color:inherit;">Wongnok Recipes</a>
    <div class="gf-right">
      <span id="userGreeting" style="margin-right: 15px; font-weight: bold; display:none;"></span>
      <a href="index.html" class="gf-button">หน้าหลัก</a>
      <a href="register.html" class="gf-button" id="registerMenu">ลงทะเบียน</a>
      <a href="create_recipe.html" class="gf-button" id="createRecipeMenu" style="display:none;">สร้างเมนูอาหาร</a>
      <a href="about.html" class="gf-button">About</a>
      <a href="login.html" class="gf-button" id="loginMenu">เข้าสู่ระบบ</a>
    </div>
  </div>

  <div class="gf-container gf-padding">
    <div id="userInfo">
      <!-- ข้อมูลผู้ใช้จะโหลดมาแสดงที่นี่ -->
      <h2>ข้อมูลผู้ใช้</h2>
      <p>กำลังโหลดข้อมูล...</p>
    </div>


  <div class="gf-container gf-padding">
    <h2>เมนูอาหารของฉัน</h2>
    <div id="userRecipeList" class="gf-row-padding gf-margin-top gf-container"></div>
  </div>


  <!-- Modal แก้ไขเมนู -->
<div id="editModal" class="gf-modal" style="display:none;">
    <div class="gf-modal-content gf-card-4 gf-padding" style="max-width:600px;margin:auto;">
      <span onclick="closeEditModal()" class="gf-button gf-red gf-right">&times;</span>
      <h3>แก้ไขเมนู</h3>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <input type="text" id="editTitle" class="gf-input gf-border" placeholder="ชื่อเมนู" /><br /><br />
        <textarea id="editDetail" class="gf-input gf-border" placeholder="รายละเอียด"></textarea><br /><br />
        <textarea id="editIngredients" class="gf-input gf-border" placeholder="วัตถุดิบ"></textarea><br /><br />
        <textarea id="editSteps" class="gf-input gf-border" placeholder="ขั้นตอนการทำ"></textarea><br /><br />
        <input
          type="number"
          id="editCookingTime"
          class="gf-input gf-border"
          placeholder="เวลาปรุง (นาที)"
        /><br /><br />
        <input type="url" id="editImageUrl" class="gf-input gf-border" placeholder="URL รูปภาพ" /><br /><br />
        <button class="gf-button gf-green" type="submit">บันทึก</button>
      </form>
    </div>
  </div>

<br><br>
  <footer style="background-color:#333; color:white; text-align:center; padding:20px; margin-top:40px;">
  <p>เว็บไซต์แชร์สูตรเมนูอาหารสำหรับทุกคน Login เพื่อสร้างเมนูอาหารของคุณ และโหวตเมนูอาหารของเพื่อน</p>
  <p>ติดต่อ: 505985@wongnok.app</p>
  <p>พัฒนาโดย: GungFuu 1.</p>
</footer>
</body>
</html>
